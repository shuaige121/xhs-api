name = "xhs-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

# 绑定自定义域名 api.maplesgedu.com
# 在 Cloudflare Dashboard 设置 route: api.maplesgedu.com/xhs/*
routes = [
  { pattern = "api.maplesgedu.com/xhs/*", zone_name = "maplesgedu.com" }
]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "xhs-db"
database_id = "dcd27753-681e-4be8-8a54-aa0cdbd4facc"

# 环境变量 (敏感信息用 secrets)
# wrangler secret put XHS_APP_KEY
# wrangler secret put XHS_APP_SECRET
[vars]
FRONTEND_URL = "https://maplesgedu.com"
